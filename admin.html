<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petalea | Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="admin.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <a href="index.html" class="brand-logo" style="margin-bottom: 2rem; font-size: 1.5rem;">Petalea <span>Admin</span></a>
        <nav>
            <a href="#dashboard" class="nav-link active"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="#products-panel" class="nav-link"><i class="fas fa-box"></i> Products</a>
            <a href="#orders-panel" class="nav-link"><i class="fas fa-shopping-cart"></i> Orders</a>
            <a href="index.html" class="nav-link" style="margin-top: 2rem;"><i class="fas fa-external-link-alt"></i> View Store</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="dashboard-header" id="dashboard">
            <h1 style="font-family: 'Outfit', sans-serif;">Overview</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Sales</div>
                <div class="stat-value" id="total-sales">₱0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Orders</div>
                <div class="stat-value" id="total-orders">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Active Products</div>
                <div class="stat-value" id="total-products">0</div>
            </div>
        </div>

        <div class="panel" id="products-panel">
            <div class="panel-header">
                <h2 style="font-family: 'Outfit', sans-serif;">Manage Products</h2>
            </div>
            <form id="add-product-form" class="add-form" style="margin-bottom: 2rem;">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="add-name" required placeholder="e.g. Red Roses">
                </div>
                <div class="form-group" style="max-width: 150px;">
                    <label>Price (₱)</label>
                    <input type="number" id="add-price" required placeholder="0.00" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="add-image" required placeholder="assets/hero_bouquet_xxxx.png">
                </div>
                <button type="submit" class="btn btn-primary" style="height: 52px; padding: 0 1.5rem;">Add Product</button>
            </form>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="products-tbody">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>

        <div class="panel" id="orders-panel">
            <div class="panel-header">
                <h2 style="font-family: 'Outfit', sans-serif;">Recent Orders</h2>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="orders-tbody">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <script src="data.js"></script>
    <script src="admin.js"></script>
</body>
</html>
